services:
  fisherman-server:
    build: .
    container_name: fisherman_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - JWT_SECRET=fisherman_production_secret_change_in_prod
      - DB_PATH=/app/data/fisherman.db
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
